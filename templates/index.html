<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>給你的一周年</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="page">

    <section class="card">

        <div class="heart">
            ♥
        </div>

        <div class="eyebrow">
            OUR FIRST ANNIVERSARY
        </div>

        <h1>
            給你的一周年
        </h1>

        <p class="message">
            謝謝你陪我走過這一年。<br>
            往後的每一年，也請多多指教。
        </p>

        <div class="date">
            2025.10.06 — Forever
        </div>

        <button onclick="showSecret()">
            給你的一句話
        </button>

        <div id="secret" class="secret">

            遇見你，是我這一年最幸運的事。<br>

            <strong>
                一周年快樂，我愛你。♥
            </strong>

        </div>

    </section>

</main>


<script>

function showSecret() {

    const secret =
        document.getElementById("secret");

    secret.classList.toggle("show");

}

</script>

</body>

</html>
